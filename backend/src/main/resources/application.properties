# Application Info
spring.application.name=dairytrace-backend
server.port=8080
server.servlet.context-path=/api

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dairytrace}
spring.datasource.username=${DB_USER:dairyuser}
spring.datasource.password=${DB_PASSWORD:dairypassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.dairytrace=DEBUG
logging.level.org.springframework.web=INFO
