version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: dairytrace-db
    environment:
      POSTGRES_DB: dairytrace
      POSTGRES_USER: dairyuser
      POSTGRES_PASSWORD: dairypassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    networks:
      - dairytrace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dairyuser -d dairytrace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dairytrace-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/dairytrace
      SPRING_DATASOURCE_USERNAME: dairyuser
      SPRING_DATASOURCE_PASSWORD: dairypassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - dairytrace-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dairytrace-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - dairytrace-network

volumes:
  postgres-data:
    driver: local

networks:
  dairytrace-network:
    driver: bridge
